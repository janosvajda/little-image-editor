<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- The precision hotspot remains at (26, 26); the halo keeps the tool visible over image pixels. -->
  <defs>
    <filter id="cursorHalo" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="1" result="outline"/>
      <feFlood flood-color="{{ColorPalette.White}}"/>
      <feComposite in2="outline" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#cursorHalo)" stroke-linejoin="round" stroke-linecap="round">
    <path d="m2 13 9-9 11 11-9 9Z" fill="{{ColorPalette.White}}" stroke="{{ColorPalette.MidnightBlue}}" stroke-width="1.5"/>
    <path d="m2 13 11 11 9-9H4Z" fill="{{ColorPalette.PencilGold}}" stroke="{{ColorPalette.MidnightBlue}}" stroke-width="1.5"/>
    <path d="m7 8 9 9M6 2l4 4" fill="none" stroke="{{ColorPalette.MidnightBlue}}" stroke-width="1.5"/>
    <path d="M21 15s-3 4-3 6a3 3 0 0 0 6 0c0-2-3-6-3-6Z" fill="{{ColorPalette.LeafGreen}}" stroke="{{ColorPalette.White}}" stroke-width="1.2"/>
  </g>
  <g fill="none" stroke-linecap="square">
    <path d="M26 19v5m0 4v4M19 26h5m4 0h4" stroke="{{ColorPalette.White}}" stroke-width="4"/>
    <path d="M26 19v5m0 4v4M19 26h5m4 0h4" stroke="{{ColorPalette.MidnightBlue}}" stroke-width="2"/>
  </g>
  <rect x="25" y="25" width="2" height="2" fill="{{ColorPalette.PencilGold}}"/>
</svg>
